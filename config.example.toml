# ============================================================
#  cc-connect - конфигурация (шаблон)
# ============================================================
#  Скопируй в ~/.cc-connect/config.toml и подставь свои значения.
#  Единственное, что обязательно: токен телеграм-бота.
#
#  ВАЖНО, см. раздел [tts] и [speech] в SKILL.md - без них мост
#  работает, но голос не распознаётся и не озвучивается.
#
#  Пути ниже помечены <PROJECT_DIR> - замени на свою рабочую папку.
#  Обратные слэши в TOML - escape-последовательности, поэтому
#  используются прямые.
# ============================================================

# ── Глобальные настройки ──────────────────────────────────
# Ключ, поставленный ПОСЛЕ заголовка [таблицы], TOML относит к ней.
# Именно так attachment_send однажды уехал в [management] и молча отключился.

language = "en"
shell    = "powershell.exe"

# Возврат файлов/картинок агента в чат
attachment_send = "on"

[log]
level = "info"

# ── Веб-админка и Management API ──────────────────────────
# Ключа web_port в cc-connect не существует - порт задаётся здесь.
[management]
enabled = false
port    = 9820
token   = "CHANGE-ME-management-token"
cors_origins = ["http://localhost:9820"]

# ── Как выглядит вывод в чате ─────────────────────────────
# full    — мысли и вызовы инструментов отдельными сообщениями
# compact — только финальный ответ
# quiet   — всё одним сообщением, в конце галочка
[display]
mode = "compact"

# Мгновенное "Обрабатываю..." до запуска агента.
[instant_reply]
enabled = true

[rate_limit]
max_messages = 20
window_secs  = 60

# ============================================================
#  ПРОЕКТ
# ============================================================
[[projects]]
name = "my-project"

# Привилегированные команды: /dir, /shell, /restart, /upgrade, /show,
# /web, /diff. "*" = любой, кто прошёл allow_from.
#
# ⚠️ admin_from = "*" даёт администратора ВСЕМ, кто прошёл allow_from,
# включая полный доступ к шеллу хоста. Для одиночного использования
# нормально; для публичного бота ставь свой числовой ID.
admin_from = "*"

# Ротация сессии после простоя, минут. 30 по умолчанию.
# Ставь 0, иначе Telegram после получаса молчания заведёт новую
# сессию и разойдётся по контексту с десктопом и CLI.
reset_on_idle_mins = 0

# Потолок на один ход агента, минут. 0 = без ограничения.
max_turn_time_mins = 45

[projects.agent]
type = "opencode"

[projects.agent.options]
# ТОЛЬКО имя бинаря. Никаких дополнительных элементов массива!
#
# core.ParseCmdOpts делит массив на бинарь и extraArgs, но
# opencode.go:654 (listOpencodeSessions) передаёт только бинарь.
# Если поставить ["node.exe", ".../opencode-shim.js"], то /list
# выполнит node.exe session list - и упадёт с exit status 1.
# Маршрутизация делается шимом, подключённым через npm-шим:
#   opencode-shim/install-npm-shim.ps1
cmd      = ["opencode"]
work_dir = "<PROJECT_DIR>"
mode     = "yolo"

# ── Модели ─────────────────────────────────────────────────
# Реестр для команды /model в чате. Все перечисленные - бесплатные
# модели шлюза opencode, ключ не нужен.
#
# Алиас - короткое имя: /model switch bunny
# Актуальный список: opencode models
#
# САМА модель по умолчанию здесь намеренно НЕ закреплена: прописанный
# model ломает /model switch. Значение по умолчанию живёт в общем
# конфиге opencode - см. opencode.jsonc.example.json.

[[projects.agent.providers]]
name = "opencode"

[[projects.agent.providers.models]]
model = "opencode/space-bunny-free"
alias = "bunny"

[[projects.agent.providers.models]]
model = "opencode/cat-jam-free"
alias = "jam"

[[projects.agent.providers.models]]
model = "opencode/ling-3.1-flash-free"
alias = "ling"

[[projects.agent.providers.models]]
model = "opencode/ling-3.0-flash-fin-free"
alias = "ling-fin"

[[projects.agent.providers.models]]
model = "opencode/step-5-preview-free"
alias = "step"

[[projects.agent.providers.models]]
model = "opencode/longcat-2.5-preview-free"
alias = "longcat"

[[projects.agent.providers.models]]
model = "opencode/mimo-v2.6-flash-free"
alias = "mimo"

[[projects.agent.providers.models]]
model = "opencode/muse-spark-1.3-contributor-free"
alias = "muse"

[[projects.agent.providers.models]]
model = "opencode/nemotron-3-ultra-free"
alias = "nemotron"

[[projects.agent.providers.models]]
model = "opencode/nemotron-3.5-lightning-free"
alias = "nemotron-l"

[[projects.agent.providers.models]]
model = "opencode/exo-free"
alias = "exo"

[[projects.agent.providers.models]]
model = "opencode/big-pickle"
alias = "pickle"

[[projects.platforms]]
type = "telegram"

[projects.platforms.options]
# Поддерживается подстановка ${ПЕРЕМЕННАЯ} - держи токен в переменной
# окружения, а не в этом файле.
token      = "CHANGE-ME-your-telegram-bot-token"
allow_from = "*"

# ============================================================
#  TTS - голосовые ответы
# ============================================================
# Требует установленную программу edge-tts:
#   pip install edge-tts
# Это НЕ встроенный провайдер, а внешний исполняемый файл.
#
# enabled = false: голос ТОЛЬКО по явной просьбе. В чате:
#   /tts always      - отвечать голосом всегда
#   /tts voice_only  - голосом в ответ на голосовое
#
# Режима "никогда" у tts_mode нет, поэтому "только по просьбе"
# делается именно через enabled = false.
[tts]
enabled  = false
provider = "edge"
voice    = "ru-RU-DmitryNeural"
tts_mode = "voice_only"

# ============================================================
#  STT - распознавание голосовых
# ============================================================
# provider = "openai" НЕ значит OpenAI. Это любой эндпоинт,
# говорящий на OpenAI-совместимом /v1/audio/transcriptions.
#
# Здесь локальный shim поверх Handy + GigaAM (см. gigaam-stt/).
# Запускается задачей gigaam-stt-autostart.
# Ручной запуск: python gigaam-stt/server.py
# Проверка:      curl http://127.0.0.1:8300/health
[speech]
enabled  = true
provider = "openai"
language = "ru"

[speech.openai]
base_url = "http://127.0.0.1:8300/v1"
api_key  = "local"
model    = "whisper-1"