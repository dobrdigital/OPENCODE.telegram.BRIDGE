name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  templates:
    name: templates and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: syntax of every script
        run: python tools\check-syntax.py

      - name: templates are installable
        run: python tools\check-install.py

      - name: the installer writes what it was asked
        run: python tools\check-setup-writes.py

      - name: the installer refuses to leave a bad config behind
        run: python tools\check-setup-rollback.py

      - name: dependency table is internally consistent
        shell: pwsh
        run: |
          # A wrong package name is the worst failure this repo can ship:
          # it tells someone to install software that is not the thing we
          # integrate with. `opencode-ai` exists on npm at version 1.19.0 -
          # the old line whose database schema breaks the desktop app - while
          # the real package is @opencode/cli. Assert the hint we print names
          # the package the installer actually uses.
          $ErrorActionPreference = 'Stop'
          $setup = Get-Content setup.py -Raw
          $deps  = Get-Content tools\deps.py -Raw

          if ($setup -match 'npm i -g opencode-ai') {
            Write-Error 'setup.py suggests installing opencode-ai (v1.19.0, wrong schema)'
            exit 1
          }
          if ($deps -notmatch '@opencode/cli') {
            Write-Error 'deps.py does not reference @opencode/cli'
            exit 1
          }
          Write-Host 'package names consistent'

      - name: no secrets committed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = git ls-files
          $bad = @()
          foreach ($f in $tracked) {
            $hit = Select-String -Path $f -Pattern 'AAHBcy|token\s*=\s*"[0-9]{8,}:|hi58UTjo' -ErrorAction SilentlyContinue
            if ($hit) { $bad += $f }
          }
          if ($bad.Count) {
            Write-Error "possible secret in: $($bad -join ', ')"
            exit 1
          }
          Write-Host "clean: $($tracked.Count) files scanned"

      - name: paths are portable
        run: python tools\sanitize-paths.py --check

      - name: repo has not drifted from the live install
        run: python tools\check-drift.py
        # Skipped in CI: there is no live install there. On a developer machine
        # this is the check that stops "I edited the repo, why did nothing
        # change?" - the two copies diverge silently.
        continue-on-error: true

      - name: the audit fires when something is wrong
        run: python tools\check-audit.py

      - name: every installer step explains itself
        run: python tools\check-steps.py
        # A step with a heading and no reason is indistinguishable from a
        # cosmetic one, and the person running the installer has no way to
        # tell a load-bearing question from a formality.

      - name: repo carries no caches or build leftovers
        run: python tools\audit.py --only repo
        # On a clean checkout this group is silent by definition. On a
        # developer machine it catches what a tool wrote into the repository:
        # pip/cache and PowerShell's ModuleAnalysisCache were both committed
        # in the first commit, before any test could catch them.

  shim:
    name: compatibility shim
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: unit and stub e2e tests
        run: node --test opencode-shim/test-opencode-shim.js

      - name: contract tests were skipped as expected
        run: |
          # CI has no OpenCode installed, so the contract layer must skip
          # rather than fail. If this ever goes red, the skip logic broke.
          node --test opencode-shim/test-opencode-shim.js 2>&1 |
            Select-String "skipped real OpenCode binary not installed" |
            Select-Object -First 1

      - name: npm wiring is correct
        shell: pwsh
        # The shim is pointless unless the npm launchers point at it. This is
        # also what an `npm i -g @opencode/cli` silently undoes.
        run: ./opencode-shim/install-npm-shim.ps1 -Verify